server {
    listen 80;
    server_name localhost;

    # Ocultar la versión de Nginx
    server_tokens off;

    # ==========================================
    # Cabeceras de Seguridad y Restricción
    # ==========================================

    # Bloqueo total de incrustación en iframes (Anti-Clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Impedir deducción de tipos MIME (Anti-Sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # Política de Referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy (CSP):
    # - style-src: incluye https://fonts.googleapis.com para cargar la hoja de estilos de Google Fonts
    # - font-src: incluye https://fonts.gstatic.com donde se descargan los archivos woff2/ttf
    # - img-src: iTunes/Apple, TheAudioDB y Deezer
    # - media-src: archivos de reproducción de audio de Apple y Deezer
    # - connect-src: incluye explícitamente https://itunes.apple.com, TheAudioDB y Deezer
    # - frame-src 'none' & frame-ancestors 'none': rechaza cualquier tipo de iframe
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://itunes.apple.com https://*.mzstatic.com https://*.theaudiodb.com https://*.deezer.com https://*.dzcdn.net; media-src 'self' blob: https://*.apple.com https://*.mzstatic.com https://*.deezer.com https://*.dzcdn.net; connect-src 'self' https://itunes.apple.com https://api.deezer.com https://www.theaudiodb.com; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # ==========================================
    # Proxy API iTunes permite saltarnos el problema de CORS (mucho mejor q JSONP)
    # ==========================================
    location /api-itunes/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;

        rewrite ^/api-itunes/(.*)$ /$1 break;
        proxy_pass https://itunes.apple.com;

        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_redirect off;

        proxy_set_header Host itunes.apple.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header Accept "application/json, text/javascript, */*; q=0.01";
        proxy_set_header Accept-Encoding "";

        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # ==========================================
    # Archivos estáticos de producción (SPA)
    # ==========================================
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}