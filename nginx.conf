server {
    listen 3012;
    server_name localhost;

    # Ocultar versión de Nginx
    server_tokens off;

    # ==========================================
    # Cabeceras de Seguridad
    # ==========================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy (CSP):
    # - Añadido https://api.deezer.com en script-src para permitir callbacks JSONP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://api.deezer.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://itunes.apple.com https://*.mzstatic.com https://*.theaudiodb.com https://*.deezer.com https://*.dzcdn.net; media-src 'self' blob: https://*.apple.com https://*.mzstatic.com https://*.deezer.com https://*.dzcdn.net; connect-src 'self' https://itunes.apple.com https://api.deezer.com https://www.theaudiodb.com; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests;" always;

    # ==========================================
    # Proxy API iTunes
    # ==========================================
    location ~* "^/api-itunes/(search|lookup|[a-z]{2}/rss/.*)$" {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;

        rewrite ^/api-itunes/(.*)$ /$1 break;
        proxy_pass https://itunes.apple.com;

        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_redirect off;

        proxy_set_header Host itunes.apple.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header Accept "application/json, text/javascript, */*; q=0.01";
        proxy_set_header Accept-Encoding "";

        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # ==========================================
    # SPA estática
    # ==========================================
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}