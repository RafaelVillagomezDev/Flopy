version: '3.8'

services:
  frontend-nginx:
    image: nginx:alpine
    container_name: mi-app-nginx
    ports:
      - "8080:80" # Tu app estará disponible en http://localhost:8080
    volumes:
      # Montamos el archivo de config
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    restart: unless-stopped